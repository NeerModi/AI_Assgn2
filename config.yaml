project:
  name: ev-rl-charging
  seed: 42

env:
  num_vehicles: 8
  num_ports: 3
  station_max_power_kw: 30.0
  time_step_minutes: 15
  episode_horizon_hours: 24
  charging_efficiency: 0.93
  vehicle:
    arrival_window_hours: [0.0, 18.0]
    departure_after_arrival_hours: [2.0, 10.0]
    battery_capacity_kwh: [35.0, 75.0]
    initial_soc: [0.10, 0.60]
    target_soc: [0.75, 0.95]
    max_charge_power_kw: [7.0, 11.0]
  price:
    base: 0.20
    daily_amplitude: 0.08
    noise_std: 0.02
    min: 0.05
    max: 0.55
  reward:
    alpha: 1.0
    beta: 0.6
    gamma: 6.0
    delta: 3.5
    eta: 0.25

training:
  total_timesteps: 50000
  n_envs: 4
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs: {}
  eval_freq: 5000
  n_eval_episodes: 8
  deterministic_eval: true

evaluation:
  episodes: 50
  deterministic_policy: true

baselines:
  episodes: 100
  random_noop_probability: 0.0
